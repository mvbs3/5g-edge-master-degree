version: '3.8'

services:
  mec_app1_instance1:
  
    build:  
      context: .
      dockerfile: dockerfiles/Dockerfile
    image: mec_app:latest
    volumes:
      - ./mec_app1.py:/app/app.py
    environment:
      - MEC_NAME=VideoStreamingService
      - MEC_PORT=8089
      - MEC_HOST=${MEC_HOST}
      - MEC_APP=app.py
    ports:
      - "8089:8089"
    networks:
      - public_net

  mec_app1_instance2:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile
    image: mec_app:latest
