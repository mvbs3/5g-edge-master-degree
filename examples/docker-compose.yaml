      - MEC_NAME=VideoStreamingService2
      - MEC_PORT=8081
      - MEC_HOST=${MEC_HOST}
      - MEC_APP=app.py
    ports:
      - "8081:8081"
    networks:
      - public_net
    mem_limit: 512m    # Limite de memória (512MB)
    mem_reservation: 256m  # Memória reservada (256MB)


  mec_app1_instance3:
